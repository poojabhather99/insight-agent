name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
      - name: Evaluation gate (offline baseline)
        run: python -m insightagent.evals --min-basic 0.9
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t insight-agent .
      - name: Smoke test container
        run: |
          docker run -d --name ia -p 7860:7860 insight-agent
          for i in $(seq 1 20); do curl -fs localhost:7860/api/health && break || sleep 1; done
          curl -fs localhost:7860/api/health
          curl -fs -X POST localhost:7860/api/datasets/sample | grep -q '"rows":1200'
